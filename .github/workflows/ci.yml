# CI for Phase 0 task A8. Actions are pinned to commit SHAs (versions checked 2026-10-05, see docs/dependencies.md).
# What CI cannot run (real pens, GPU parity, Wayland tablet input) is listed in docs/STATUS.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  JAVA_DISTRIBUTION: temurin

jobs:
  check:
    name: Linux check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Cache Kotlin/Native
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: ./gradlew check --continue

  jvm-tests:
    name: JVM tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew jvmTest :iris-cli:test :app-desktop:test --continue
      - name: build-logic unit tests
        run: ./gradlew -p build-logic test

  android-emulator:
    name: Android emulator (API ${{ matrix.api-level }})
    strategy:
      fail-fast: false
      matrix:
        # 28 is the minimum (D-004); 35 has runtime shaders and front-buffered rendering.
        api-level: [28, 35]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedCheck --continue

  ios:
    name: iOS simulator and framework
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 26.4 (Kotlin 2.4.20)
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Cache Kotlin/Native
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: ./gradlew iosSimulatorArm64Test :app-ios:linkDebugFrameworkIosSimulatorArm64 :app-ios:linkDebugFrameworkIosArm64 --continue
      - name: Build the Xcode app for the simulator
        run: >
          xcodebuild -project app-ios/iosApp/iosApp.xcodeproj -target iosApp -configuration Debug
          -sdk iphonesimulator -arch arm64 CODE_SIGNING_ALLOWED=NO
          SYMROOT="$PWD/app-ios/build/xcode" build
      - name: Launch the app on a simulator
        run: .github/scripts/ios-smoke.sh app-ios/build/xcode/Debug-iphonesimulator/Iris.app org.appthere.iris ios-screenshot.png
      - name: Keep the simulator screenshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-screenshot
          path: ios-screenshot.png
          if-no-files-found: ignore
      - name: Binaries target iOS 15 (D-026)
        run: |
          .github/scripts/check-minos.sh 15.0 app-ios/build/bin/iosSimulatorArm64/debugFramework/IrisApp.framework/IrisApp
          .github/scripts/check-minos.sh 15.0 app-ios/build/bin/iosArm64/debugFramework/IrisApp.framework/IrisApp
          .github/scripts/check-minos.sh 15.0 app-ios/build/xcode/Debug-iphonesimulator/Iris.app/Iris
