# Versions checked 2026-10-04 against Maven Central, Google Maven, the Kotlin Gradle plugin
# compatibility table and the AGP release notes. See docs/dependencies.md before changing any.

[versions]
kotlin = "2.4.20"
agp = "9.3.1"
compose-multiplatform = "1.12.1"
androidx-activity = "1.13.0"
kotlinx-coroutines = "1.11.0"
detekt = "2.0.0-alpha.6"
spotless = "8.10.3"
ktlint = "1.8.0"
kover = "0.9.11"
kotest = "6.2.5"

# Android SDK levels (D-004: minimum Android 9 = API 28)
android-compileSdk = "36"
android-minSdk = "28"
android-targetSdk = "36"

# iOS minimum (D-024); Kotlin/Native defaults to 15.0, so every native binary overrides it
ios-minVersion = "14.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }

# Gradle plugins as libraries, for the convention plugins in build-logic
gradlePlugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
gradlePlugin-composeCompiler = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
gradlePlugin-android = { module = "com.android.tools.build:gradle", version.ref = "agp" }
gradlePlugin-compose = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose-multiplatform" }
gradlePlugin-detekt = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
gradlePlugin-spotless = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
gradlePlugin-kover = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
